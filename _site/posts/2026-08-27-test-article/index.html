<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Very Cool Test Article (not clickbait)</title>

  <!-- 1. Run theme check BEFORE rendering CSS to prevent white flash -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- 2. Tailwind CDN with explicit config -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>

<body
  class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 py-6">
    <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
      <a href="/news/"
        class="text-2xl font-black tracking-tight text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition">BeanNet
        News</a>

      <!-- Theme Toggle Button -->
      <button id="theme-toggle" type="button" aria-label="Toggle theme"
        class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 text-sm font-semibold transition">
        <span id="theme-toggle-text">Theme</span>
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
    <article
  class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden transition-colors duration-200">

  

  <div class="p-8">
    <header class="mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2 leading-tight">Very Cool Test Article (not clickbait)</h1>
      <time class="text-sm text-gray-400 dark:text-gray-400 font-medium">Wed Aug 26 2026</time>
    </header>

    <div class="prose prose-blue dark:prose-invert max-w-none text-gray-700 dark:text-gray-300 leading-relaxed">
      <p>This is testing <em>markdown</em> formatting.</p>
<h3>Here is a heading:</h3>
<ul>
<li>And here is a list</li>
<li>And another list element</li>
</ul>
<blockquote>
<p>Here is an image.</p>
</blockquote>
<p><img src="https://raw.githubusercontent.com/bakedb/news/main/src/images/testimage.jpg" alt="Image Description"></p>

    </div>

    <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
      <a href="/news/" class="text-sm font-semibold text-blue-600 dark:text-blue-400 hover:underline">Back to
        News Feed</a>
    </div>
  </div>
</article>
  </main>

  <footer
    class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
    Made with &lt;3
  </footer>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    toggleBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    });
  </script>
</body>

</html>
